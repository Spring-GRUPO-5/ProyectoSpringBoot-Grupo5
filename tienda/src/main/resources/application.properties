spring.application.name=tienda
# Nombre de la aplicacion (aparece entre corchetes en cada linea del log).

# Conexion a la base de datos gimnasio del PostgreSQL instalado en este ordenador.
# La direccion y el usuario se escriben aqui; la contrasena NO: se lee de la variable de
# entorno POSTGRES_PASSWORD, igual que en S07, para que no quede en ningun fichero del proyecto.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tiendatecnologica}
spring.datasource.username=${DB_USER:postgres}
# La contrasena no tiene valor por defecto: nunca se escribe en un fichero que se versiona (S07).
spring.datasource.password=${DB_PASSWORD:1234}

# Spring Boot usa el 8080 por defecto.
# server.port=${API_PORT}

# Para subir las imagenes
# Lee la variable de entorno que definiste en Docker, si no existe usa la ruta local de tu Mac
# Si detecta RUTA_IMAGENES (Docker) usara /app/tienda-imagenes
# Si no la detecta (IntelliJ), usara la carpeta relativa de tu Mac ../tienda-imagenes
tienda.imagenes.ruta-absoluta=${RUTA_IMAGENES:../tienda-imagenes}

# Las tablas son las de S07-1 (script sql/02-tablas-y-datos.sql), no las crea Hibernate.
# validate: al arrancar, Hibernate comprueba que cada entidad coincide con su tabla
# y detiene la aplicacion si falta una tabla o una columna.
spring.jpa.hibernate.ddl-auto=validate
# Si el contenedor de base de datos tarda un par de segundos de mas en procesar tu archivo init.sql
# spring.jpa.hibernate.ddl-auto=update

# Hibernate escribe en la consola cada sentencia SQL que envia a PostgreSQL.
spring.jpa.show-sql=true

# La sesion de Hibernate se cierra al terminar el repositorio (desactivado como en S08).
spring.jpa.open-in-view=false

# Configurar a futuro en Produccion (Ejemplo con AWS S3 o Cloudinary)
# tienda.imagenes.ruta-absoluta=https://amazonaws.com