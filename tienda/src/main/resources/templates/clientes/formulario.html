
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-shop"></i> Administración de Tienda
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 700px">

        <div class="card-header bg-white">
            <h2 class="mb-0" th:text="${titulo}">Cliente</h2>
        </div>

        <div class="card-body">

            <form th:action="@{/clientes/guardar}"
                  th:object="${cliente}"
                  method="post">

                <!-- El ID estará vacío al crear y tendrá valor al modificar -->
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Nombre *</label>
                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control"
                           maxlength="60"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Apellido *</label>
                    <input type="text"
                           th:field="*{apellido}"
                           class="form-control"
                           maxlength="60"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email *</label>
                    <input type="email"
                           th:field="*{email}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Teléfono *</label>
                    <input type="tel"
                           th:field="*{telefono}"
                           class="form-control"
                           maxlength="20"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha de nacimiento *</label>
                    <input type="date"
                           th:field="*{fecha_nacimiento}"
                           class="form-control"
                           required>
                </div>                <!-- La fecha de alta se genera automáticamente.
                     No permitimos modificarla desde el formulario. -->

                <div class="d-flex justify-content-end gap-2 mt-4">

                    <a th:href="@{/clientes}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Guardar
                    </button>

                </div>

            </form>

        </div>
    </div>

</main>

</body>
</html>
