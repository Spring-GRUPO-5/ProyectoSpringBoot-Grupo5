<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Producto</title>
</head>
<body>

<h1 th:text="${producto.nombre}">Nombre Producto</h1>
<p>Precio: $<span th:text="${producto.precio}">0.00</span></p>
<p>Categoría: <span th:text="${producto.categoria.nombre}">Categoría</span></p>
<p>Proveedor: <span th:text="${producto.proveedor.nombre}">Proveedor</span></p>

<h2>Galería de Imágenes del Producto</h2>

<div th:if="${#lists.isEmpty(producto.imagenes)}">
    <p>Este producto no tiene imágenes registradas.</p>
</div>

<!-- Recorremos todas las imágenes del producto con th:each -->
<div th:if="${!#lists.isEmpty(producto.imagenes)}">
    <div th:each="img : ${producto.imagenes}" style="display:inline-block; margin:10px;">
        <img th:src="@{'/imagenes/' + ${img.imagenUrl}}" width="150" alt="Imagen"/>
    </div>
</div>

<p><br><a th:href="@{/api/productos/web-lista}">Volver a la lista</a></p>

</body>
</html>
