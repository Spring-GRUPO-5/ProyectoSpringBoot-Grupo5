
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Imágenes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
</head>
<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Mantenimiento de imágenes</h2>
  <a th:href="@{/imagenes/nuevo}" class="btn btn-primary">
    <i class="bi bi-plus-circle"></i> Nueva imagen
  </a>
</div>

<a th:href="@{/}" class="btn btn-secondary mb-3">Volver al inicio</a>

<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<table class="table table-bordered table-striped">
  <thead>
  <tr>
    <th>ID</th>
    <th>Producto</th>
    <th>Imagen</th>
    <th>Ruta guardada</th>
    <th>Acciones</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="imagen : ${imagenes}">
    <td th:text="${imagen.id}"></td>
    <td th:text="${imagen.producto.nombre}"></td>
    <!-- REEMPLAZA LA LÍNEA DE LA IMAGEN EN TU TABLA DE LA LISTA POR ESTA: -->
    <td>
      <img th:src="@{/imagenes/{ruta}(ruta=${imagen.imagenUrl})} + '?v=' + ${cacheBuster}"
           style="width:100px; height:80px; object-fit:contain"
           class="border rounded p-1">
    </td>
    <td th:text="${imagen.imagenUrl}"></td>
    <td>

      <a th:href="@{/imagenes/editar/{id}(id=${imagen.id})}"
         class="btn btn-warning btn-sm"
         title="Modificar">
        <i class="bi bi-pencil"></i>
      </a>

      <form th:action="@{/imagenes/eliminar/{id}(id=${imagen.id})}"
            method="post"
            onsubmit="return confirm('¿Eliminar esta imagen?')">
        <button type="submit" class="btn btn-danger btn-sm">
          <i class="bi bi-trash"></i>
        </button>
      </form>
    </td>
  </tr>
  <tr th:if="${#lists.isEmpty(imagenes)}">
    <td colspan="5" class="text-center">
      No hay imágenes registradas.
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
