
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario de producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-4">

<h2 th:text="${producto.id == null ? 'Nuevo producto' : 'Modificar producto'}">
</h2>

<div th:if="${error}" class="alert alert-danger"
     th:text="${error}">
</div>

<form th:action="@{/productos/guardar}"
      th:object="${producto}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div class="mb-3">

        <label class="form-label">Nombre</label>

        <input type="text"
               th:field="*{nombre}"
               class="form-control"
               required>

    </div>

    <div class="mb-3">

        <label class="form-label">Cantidad</label>

        <input type="number"
               th:field="*{cantidad}"
               class="form-control"
               min="0"
               required>

    </div>

    <div class="mb-3">

        <label class="form-label">Precio (€)</label>

        <input type="number"
               th:field="*{precio}"
               class="form-control"
               step="0.01"
               min="0"
               required>

    </div>

    <div class="mb-3">

        <label class="form-label">Categoría</label>

        <select name="categoriaId" class="form-select" required>

            <option value="">Selecciona una categoría</option>

            <option th:each="cat : ${categorias}"
                    th:value="${cat.id}"
                    th:text="${cat.nombre}"
                    th:selected="${producto.categoria != null and producto.categoria.id == cat.id}">
            </option>

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">Proveedor</label>

        <select name="proveedorId" class="form-select" required>

            <option value="">Selecciona un proveedor</option>

            <option th:each="prov : ${proveedores}"
                    th:value="${prov.id}"
                    th:text="${prov.nombre + ' ' + (prov.apellido != null ? prov.apellido : '')}"
                    th:selected="${producto.proveedor != null and producto.proveedor.id == prov.id}">
            </option>

        </select>

    </div>

    <button type="submit" class="btn btn-success">
        Guardar
    </button>

    <a th:href="@{/productos}" class="btn btn-secondary">
        Cancelar
    </a>

</form>

</body>
</html>
