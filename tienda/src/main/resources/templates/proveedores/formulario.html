
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${titulo}">Proveedor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

  <div class="card shadow-sm mx-auto" style="max-width: 650px">

    <div class="card-header bg-primary text-white">
      <h4 th:text="${titulo}">Proveedor</h4>
    </div>

    <div class="card-body">

      <form th:action="@{/proveedores/guardar}"
            th:object="${proveedor}"
            method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
          <label class="form-label">Nombre *</label>
          <input type="text"
                 th:field="*{nombre}"
                 class="form-control"
                 maxlength="60"
                 required>
        </div>

        <div class="mb-3">
          <label class="form-label">Apellido</label>
          <input type="text"
                 th:field="*{apellido}"
                 class="form-control"
                 maxlength="60">
        </div>

        <div class="mb-3">
          <label class="form-label">Teléfono *</label>
          <input type="text"
                 th:field="*{telefono}"
                 class="form-control"
                 maxlength="20"
                 required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email *</label>
          <input type="email"
                 th:field="*{email}"
                 class="form-control"
                 maxlength="150"
                 required>
        </div>

        <div class="d-flex justify-content-between">
          <a th:href="@{/proveedores}"
             class="btn btn-secondary">
            Cancelar
          </a>

          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> Guardar
          </button>
        </div>

      </form>

    </div>
  </div>
</div>

</body>
</html>
