spring.application.name=tienda
# Nombre de la aplicación (aparece entre corchetes en cada línea del log).

# Conexión a la base de datos "gimnasio" del PostgreSQL instalado en este ordenador.
# La dirección y el usuario se escriben aquí; la contraseña NO: se lee de la variable de
# entorno POSTGRES_PASSWORD, igual que en S07, para que no quede en ningún fichero del proyecto.
spring.datasource.url=jdbc:postgresql://localhost:5432/tiendatecnologica
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

# Las tablas son las de S07-1 (script sql/02-tablas-y-datos.sql), no las crea Hibernate.
# validate: al arrancar, Hibernate comprueba que cada entidad coincide con su tabla
# y detiene la aplicación si falta una tabla o una columna.
spring.jpa.hibernate.ddl-auto=validate

# Hibernate escribe en la consola cada sentencia SQL que envía a PostgreSQL.
spring.jpa.show-sql=true

# La sesión de Hibernate se cierra al terminar el repositorio (desactivado como en S08).
spring.jpa.open-in-view=false
