<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Imagen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 th:text="${imagen.id == null ? 'Registrar imagen' : 'Modificar imagen'}"></h2>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form th:action="@{/imagenes/guardar}" method="post" enctype="multipart/form-data">
  <input type="hidden" name="id" th:value="${imagen.id}">

  <div class="mb-3">
    <label class="form-label">Producto</label>
    <select name="productoId" class="form-select" required>
      <option value="">Selecciona un producto</option>
      <option th:each="producto : ${productos}"
              th:value="${producto.id}"
              th:selected="${imagen.producto != null and imagen.producto.id == producto.id}"
              th:text="${producto.nombre}">
      </option>
    </select>
  </div>

  <!-- Bloque unificado corregido: Se asegura que se muestre siempre que haya una URL o que JS actúe -->
  <!-- REEMPLAZA TU BLOQUE DE IMAGEN ACTUAL POR ESTE: -->
  <div class="mb-3" id="contenedorImagen" th:style="${imagen.imagenUrl == null} ? 'display:none;' : ''">
    <label class="form-label" id="etiquetaEstado">Imagen del registro</label>
    <br>
    <img id="vistaPrevia"
         th:src="${imagen.imagenUrl != null} ? @{/imagenes/{ruta}(ruta=${imagen.imagenUrl})} + '?v=' + ${cacheBuster} : ''"
         style="width:150px; height:120px; object-fit:contain"
         class="border rounded p-1">
  </div>

  <div class="mb-3">
    <label class="form-label">Seleccionar imagen</label>
    <input type="file" id="inputArchivo" name="archivo" class="form-control"
           accept="image/png,image/jpeg,image/webp,image/gif"
           th:required="${imagen.id == null}">
    <small class="text-muted">
      Al modificar, deja este campo vacío para conservar la imagen actual.
    </small>
  </div>

  <button type="submit" class="btn btn-primary">Guardar</button>
  <a th:href="@{/imagenes}" class="btn btn-secondary">Cancelar</a>
</form>

<script>
  // Almacenamos la ruta inicial de Thymeleaf de forma segura
  const imgElement = document.getElementById('vistaPrevia');
  const rutaOriginal = imgElement ? imgElement.src : '';

  document.getElementById('inputArchivo').addEventListener('change', function(event) {
      const contenedor = document.getElementById('contenedorImagen');
      const imgPreview = document.getElementById('vistaPrevia');
      const etiqueta = document.getElementById('etiquetaEstado');
      const archivos = event.target.files;

      if (archivos && archivos[0]) {
          const visor = new FileReader();

          visor.onload = function(e) {
              imgPreview.src = e.target.result; // Intercambia los bytes locales para previsualizar sin pasar por servidor
              etiqueta.textContent = "Nueva imagen seleccionada (Vista previa)";
              etiqueta.className = "form-label text-success fw-bold";
              contenedor.style.display = "block"; // Forzamos muestra visual nativa
          }

          visor.readAsDataURL(archivos[0]);
      } else {
          // Si el usuario remueve la selección del input, regresamos al estado Thymeleaf original
          if (rutaOriginal && !rutaOriginal.endsWith('/') && !rutaOriginal.includes('null')) {
              imgPreview.src = rutaOriginal;
              etiqueta.textContent = "Imagen del registro";
              etiqueta.className = "form-label";
          } else {
              imgPreview.src = "";
              contenedor.style.display = "none";
          }
      }
  });
</script>
</body>
</html>
