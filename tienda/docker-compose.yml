# Objetivo: levantar la API y PostgreSQL mapeando las imágenes del repositorio padre.
# Uso: docker compose up -d

services:
  # Servicio de la base de datos PostgreSQL
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: tiendatecnologica
    ports:
      - "5433:5432" # Puerto libre para conectarte mediante pgAdmin
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SCRIPT DE INICIALIZACIÓN AUTOMÁTICA
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tiendatecnologica"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servicio de tu API de Spring Boot
  api:
    image: tienda:1.0 # Imagen multiplataforma real de Docker Hub
    ports:
      - "8081:8080" # Mapeado al puerto 8081 en tu equipo local
    environment:
      DB_URL: jdbc:postgresql://db:5432/tiendatecnologica
      DB_USER: postgres
      DB_PASSWORD: "1234"
      # 👇 LE INDICAMOS A JAVA LA RUTA INTERNA DEL CONTENEDOR
      RUTA_IMAGENES: /app/tienda-imagenes
    volumes:
      # 👇 EL PUENTE MÁGICO: Vincula la carpeta padre de tu Mac con el contenedor
      - ../tienda-imagenes:/app/tienda-imagenes
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
