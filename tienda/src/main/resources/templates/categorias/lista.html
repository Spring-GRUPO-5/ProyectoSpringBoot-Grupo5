
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Categorías</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2>Gestión de categorías</h2>

    <a th:href="@{/categorias/nuevo}" class="btn btn-primary">
      <i class="bi bi-plus-circle"></i> Nueva categoría
    </a>

  </div>

  <div th:if="${mensaje}" class="alert alert-success"
       th:text="${mensaje}"></div>

  <div th:if="${error}" class="alert alert-danger"
       th:text="${error}"></div>

  <div class="card shadow-sm">
    <div class="card-body">

      <div class="table-responsive">

        <table class="table table-striped table-hover align-middle">

          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th class="text-center">Acciones</th>
          </tr>
          </thead>

          <tbody>

          <tr th:each="categoria : ${categorias}">

            <td th:text="${categoria.id}"></td>

            <td th:text="${categoria.nombre}"></td>

            <td class="text-center">

              <a th:href="@{/categorias/editar/{id}(id=${categoria.id})}"
                 class="btn btn-warning btn-sm"
                 title="Modificar">

                <i class="bi bi-pencil"></i>
              </a>

              <form th:action="@{/categorias/eliminar/{id}(id=${categoria.id})}"
                    method="post"
                    class="d-inline"
                    onsubmit="return confirm('¿Deseas eliminar esta categoría?')">

                <button type="submit"
                        class="btn btn-danger btn-sm"
                        title="Eliminar">

                  <i class="bi bi-trash"></i>
                </button>

              </form>

            </td>

          </tr>

          <tr th:if="${#lists.isEmpty(categorias)}">
            <td colspan="3" class="text-center text-muted">
              No hay categorías registradas.
            </td>
          </tr>

          </tbody>

        </table>

      </div>

    </div>
  </div>

  <a th:href="@{/}" class="btn btn-secondary mt-3">
    <i class="bi bi-arrow-left"></i> Volver al inicio
  </a>

</div>

</body>
</html>
