
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Mantenimiento de productos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
</head>

<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-3">

  <h2>Mantenimiento de productos</h2>

  <a th:href="@{/productos/nuevo}" class="btn btn-primary">
    <i class="bi bi-plus-circle"></i> Nuevo producto
  </a>

</div>

<a th:href="@{/}" class="btn btn-secondary mb-3">
  Volver al inicio
</a>

<div th:if="${mensaje}" class="alert alert-success"
     th:text="${mensaje}"></div>

<div th:if="${error}" class="alert alert-danger"
     th:text="${error}"></div>

<table class="table table-bordered table-striped align-middle">

  <thead>
  <tr>
    <th>ID</th>
    <th>Imagen</th>
    <th>Nombre</th>
    <th>Cantidad</th>
    <th>Precio</th>
    <th>Categoría</th>
    <th>Proveedor</th>
    <th>Acciones</th>
  </tr>
  </thead>

  <tbody>

  <tr th:each="prod : ${productos}">

    <td th:text="${prod.id}"></td>

    <td>

      <img th:if="${prod.imagenes != null and !#lists.isEmpty(prod.imagenes)}"
           th:src="@{'/imagenes/' + ${prod.imagenes[0].imagenUrl}}"
           style="width:80px; height:65px; object-fit:contain"
           class="border rounded p-1"
           alt="Imagen del producto">

      <span th:if="${prod.imagenes == null or #lists.isEmpty(prod.imagenes)}">
                Sin imagen
            </span>

    </td>

    <td th:text="${prod.nombre}"></td>

    <td th:text="${prod.cantidad}"></td>

    <td th:text="${prod.precio} + ' €'"></td>

    <td th:text="${prod.categoria.nombre}"></td>

    <td th:text="${prod.proveedor.nombre}"></td>

    <td>

      <a th:href="@{/productos/editar/{id}(id=${prod.id})}"
         class="btn btn-warning btn-sm"
         title="Modificar">

        <i class="bi bi-pencil"></i>

      </a>

      <form th:action="@{/productos/eliminar/{id}(id=${prod.id})}"
            method="post"
            style="display:inline"
            onsubmit="return confirm('¿Eliminar este producto?')">

        <button type="submit"
                class="btn btn-danger btn-sm"
                title="Eliminar">

          <i class="bi bi-trash"></i>

        </button>

      </form>

    </td>

  </tr>

  <tr th:if="${#lists.isEmpty(productos)}">

    <td colspan="8" class="text-center">
      No hay productos registrados.
    </td>

  </tr>

  </tbody>

</table>

</body>
</html>
