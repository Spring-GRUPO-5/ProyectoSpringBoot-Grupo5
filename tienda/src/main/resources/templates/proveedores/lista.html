
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Proveedores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestión de proveedores</h2>

    <a th:href="@{/proveedores/nuevo}" class="btn btn-primary">
      <i class="bi bi-plus-circle"></i> Nuevo proveedor
    </a>
  </div>

  <div th:if="${mensaje}" class="alert alert-success"
       th:text="${mensaje}"></div>

  <div th:if="${error}" class="alert alert-danger"
       th:text="${error}"></div>

  <div class="card shadow-sm">
    <div class="card-body">

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">

          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th class="text-center">Acciones</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="proveedor : ${proveedores}">
            <td th:text="${proveedor.id}"></td>
            <td th:text="${proveedor.nombre}"></td>
            <td th:text="${proveedor.apellido}"></td>
            <td th:text="${proveedor.telefono}"></td>
            <td th:text="${proveedor.email}"></td>

            <td class="text-center">

              <a th:href="@{/proveedores/editar/{id}(id=${proveedor.id})}"
                 class="btn btn-warning btn-sm"
                 title="Modificar">
                <i class="bi bi-pencil"></i>
              </a>

              <form th:action="@{/proveedores/eliminar/{id}(id=${proveedor.id})}"
                    method="post"
                    class="d-inline"
                    onsubmit="return confirm('¿Deseas eliminar este proveedor?')">

                <button type="submit"
                        class="btn btn-danger btn-sm"
                        title="Eliminar">
                  <i class="bi bi-trash"></i>
                </button>
              </form>

            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(proveedores)}">
            <td colspan="6" class="text-center text-muted">
              No hay proveedores registrados.
            </td>
          </tr>

          </tbody>
        </table>
      </div>

    </div>
  </div>

  <a th:href="@{/}" class="btn btn-secondary mt-3">
    <i class="bi bi-arrow-left"></i> Volver al inicio
  </a>

</div>

</body>
</html>
